<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="jooy2 - Software Engineer">
  <title>jooy2 - Software Engineer</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1b27" />
      <stop offset="55%" stop-color="#1f2135" />
      <stop offset="100%" stop-color="#161724" />
    </linearGradient>

    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#70a5fd" stop-opacity="0.30" />
      <stop offset="65%" stop-color="#70a5fd" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#70a5fd" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdae" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#38bdae" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#38bdae" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a9fef7" stop-opacity="0" />
      <stop offset="50%" stop-color="#a9fef7" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#a9fef7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#70a5fd" />
      <stop offset="55%" stop-color="#38bdae" />
      <stop offset="100%" stop-color="#38bdae" stop-opacity="0" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8b93c4" stroke-opacity="0.07" stroke-width="1" />
    </pattern>

    <clipPath id="card">
      <rect x="0" y="0" width="1200" height="320" rx="18" />
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <!-- base -->
    <rect width="1200" height="320" fill="url(#bg)" />

    <!-- drifting grid: translates exactly one tile, so the loop is seamless -->
    <rect x="-80" y="-80" width="1400" height="520" fill="url(#grid)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="40 40" dur="14s" repeatCount="indefinite" />
    </rect>

    <!-- ambient glows -->
    <ellipse cx="965" cy="150" rx="300" ry="220" fill="url(#glowBlue)">
      <animate attributeName="rx" values="300;332;300" dur="11s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.85;1;0.85" dur="11s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="120" cy="300" rx="280" ry="180" fill="url(#glowTeal)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="13s" repeatCount="indefinite" />
    </ellipse>

    <!-- light sweep across the card -->
    <g transform="skewX(-18)">
      <rect x="-260" y="-90" width="230" height="500" fill="url(#sweep)">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="1700 0" dur="9s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- floating micro shapes -->
    <g fill="none" stroke-width="1.2">
      <rect x="742" y="66" width="12" height="12" stroke="#70a5fd" stroke-opacity="0.35">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="7s" repeatCount="indefinite" />
      </rect>
      <polygon points="700,250 708,264 692,264" stroke="#70a5fd" stroke-opacity="0.32">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 9; 0 0" dur="9s" repeatCount="indefinite" />
      </polygon>
      <circle cx="1152" cy="252" r="6" stroke="#38bdae" stroke-opacity="0.45">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="8s" repeatCount="indefinite" />
      </circle>
      <g transform="rotate(20 1136 62)">
        <rect x="1132" y="58" width="9" height="9" stroke="#38bdae" stroke-opacity="0.4">
          <animateTransform attributeName="transform" type="translate" values="0 0; 0 7; 0 0" dur="10s" repeatCount="indefinite" />
        </rect>
      </g>
    </g>

    <!-- geometric cluster -->
    <g transform="translate(965 158)" fill="none" stroke-linejoin="round">
      <!-- dashed outer orbit -->
      <circle r="124" stroke="#70a5fd" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="5 11">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="52s" repeatCount="indefinite" />
      </circle>

      <!-- outer hexagon -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="44s" repeatCount="indefinite" />
        <polygon points="0,-96 83.1,-48 83.1,48 0,96 -83.1,48 -83.1,-48" stroke="#70a5fd" stroke-opacity="0.55" stroke-width="1.6" />
      </g>

      <!-- mid hexagon -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite" />
        <polygon points="0,-62 53.7,-31 53.7,31 0,62 -53.7,31 -53.7,-31" stroke="#38bdae" stroke-opacity="0.6" stroke-width="1.4" />
      </g>

      <!-- inner triangle -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite" />
        <polygon points="0,-32 27.7,16 -27.7,16" stroke="#a9fef7" stroke-opacity="0.45" stroke-width="1.3" />
      </g>

      <!-- core -->
      <circle r="4.5" fill="#a9fef7" stroke="none">
        <animate attributeName="r" values="4;6;4" dur="3.4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.75;1;0.75" dur="3.4s" repeatCount="indefinite" />
      </circle>

      <!-- orbiting nodes -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite" />
        <circle cx="124" cy="0" r="4" fill="#70a5fd" stroke="none" />
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="180" to="-180" dur="24s" repeatCount="indefinite" />
        <circle cx="96" cy="0" r="3" fill="#38bdae" stroke="none" />
      </g>
    </g>

    <!-- text block -->
    <g font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif">
      <text x="88" y="118" fill="#38bdae" font-size="14" font-weight="600" letter-spacing="6.5">SOFTWARE ENGINEER</text>
      <text x="86" y="188" fill="#c0caf5" font-size="66" font-weight="700" letter-spacing="-1">jooy2</text>
      <text x="88" y="236" fill="#8b93c4" font-size="18" letter-spacing="0.4">Open Source · Web &amp; Application Services</text>

      <!-- underline drawing itself -->
      <line x1="88" y1="208" x2="88" y2="208" stroke="url(#rule)" stroke-width="2.5" stroke-linecap="round">
        <animate attributeName="x2" values="88;404;404;88" keyTimes="0;0.35;0.85;1" dur="10s" repeatCount="indefinite" />
      </line>
    </g>

    <!-- corner frame accents -->
    <g fill="none" stroke="#70a5fd" stroke-width="2" stroke-linecap="round">
      <animate attributeName="stroke-opacity" values="0.25;0.7;0.25" dur="6s" repeatCount="indefinite" />
      <path d="M22 52V30a8 8 0 0 1 8-8h22" />
      <path d="M1148 22h22a8 8 0 0 1 8 8v22" />
      <path d="M1178 268v22a8 8 0 0 1-8 8h-22" />
      <path d="M52 298H30a8 8 0 0 1-8-8v-22" />
    </g>
  </g>

  <!-- card border -->
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="18" fill="none" stroke="#323757" stroke-width="1.5" />
</svg>
